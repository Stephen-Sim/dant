name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check maintained source and documentation formatting
        run: npm run format:prettier:check
      - name: Check TypeScript contracts and adopted state enums
        run: |
          npm run typecheck
          npm run check:states
      - name: Install pinned Python test and coverage dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/ci/python-coverage-requirements.txt
      - name: Require VM test tools and check Bash syntax
        run: node scripts/ci/preflight.mts
      - name: Check PowerShell syntax without running VM scripts
        shell: pwsh
        run: ./scripts/ci/check-powershell.ps1
      - name: Check application versions
        run: node scripts/ci/version.mts
      - name: Test release version gate
        run: node --test tests/tooling/build/version.test.mts tests/tooling/build/coverage.test.mts tests/tooling/build/test-files.test.mts
      - name: Test application and enforce coverage
        run: npm run test:coverage
      - name: Test and measure all Python VM helpers
        run: npm run test:python:coverage
      - name: Install the pinned PowerShell coverage tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/powershell/Modules | Out-Null
          Save-Module -Name Pester -RequiredVersion 5.9.0 -Path .tools/powershell/Modules -Repository PSGallery -Force -AcceptLicense
      - name: Instrument and test maintained PowerShell commands
        if: runner.os == 'Windows'
        run: npm run test:powershell:coverage
      - name: Build the pinned Bash coverage tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config binutils-dev libiberty-dev libssl-dev libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev
          git init .tools/kcov-source
          git -C .tools/kcov-source remote add origin https://github.com/SimonKagstrom/kcov.git
          git -C .tools/kcov-source fetch --depth=1 origin a39874f938ce13f7a65f253120d1ec946b349ffe
          git -C .tools/kcov-source checkout --detach FETCH_HEAD
          test "$(git -C .tools/kcov-source rev-parse HEAD)" = a39874f938ce13f7a65f253120d1ec946b349ffe
          git -C .tools/kcov-source fetch --depth=1 origin refs/tags/v43:refs/tags/v43
          test "$(git -C .tools/kcov-source rev-parse 'v43^{commit}')" = a39874f938ce13f7a65f253120d1ec946b349ffe
          test "$(git -C .tools/kcov-source describe --exact-match --tags HEAD)" = v43
          cmake -S .tools/kcov-source -B .tools/kcov-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/.tools/kcov"
          cmake --build .tools/kcov-build --parallel 2
          cmake --install .tools/kcov-build
      - name: Instrument and test maintained Bash scripts
        if: runner.os == 'Linux'
        run: npm run test:bash:coverage
      - name: Inventory coverage across all maintained executable code
        if: always()
        run: npm run coverage:inventory
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: .cache/coverage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Build frontend
        run: npm run build
