[package]
name = "dant"
version = "0.4.4"
description = "A digital companion with its own computer"
license = "MIT"
authors = ["dant"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[profile.release]
strip = true
lto = true
codegen-units = 1
