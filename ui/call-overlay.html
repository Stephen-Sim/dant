<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'; media-src 'none'"
    />
    <link rel="stylesheet" href="/call-overlay.css" />
    <title>dant call</title>
  </head>
  <body>
    <main id="call-overlay" hidden>
      <img
        class="call-icon"
        src="/brand/dant-avatar.svg"
        alt=""
        aria-hidden="true"
        draggable="false"
      />
      <div class="call-details">
        <strong>dant</strong><span id="call-status" role="status" aria-live="polite"></span
        ><time id="call-duration" hidden></time>
      </div>
      <div class="call-actions">
        <button type="button" id="call-mute" hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8" />
            <path id="mute-slash" d="M3 3l18 18" hidden />
          </svg></button
        ><button type="button" id="call-hangup" class="hangup">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <path
              d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7l.5 2.8a2 2 0 0 1-.6 1.9L8.7 10.7a16 16 0 0 0 4.6 4.6l1.3-1.3a2 2 0 0 1 1.9-.6l2.8.5a2 2 0 0 1 1.7 2Z"
            />
          </svg></button
        ><button type="button" id="call-restore" class="restore">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <path d="M8 3H3v5m13 13h5v-5M3 3l6 6m12 12-6-6M16 3h5v5M8 21H3v-5" />
          </svg></button
        ><button type="button" id="call-hide" class="hide">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
          </svg>
        </button>
      </div>
    </main>
    <script type="module" src="/call/call-overlay.mts"></script>
  </body>
</html>
